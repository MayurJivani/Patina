# Standalone: the relay plus its own Caddy, for a box that isn't already
# terminating TLS for something else. On Jinx use docker-compose.tunnel.yml.
services:
  patina:
    build: .
    restart: unless-stopped
    environment:
      PORT: "4323"
    volumes:
      - patina-data:/app/data
    expose:
      - "4323"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data     # certificates — losing this re-issues on every deploy
      - caddy-config:/config
    depends_on:
      - patina

volumes:
  patina-data:
  caddy-data:
  caddy-config:
